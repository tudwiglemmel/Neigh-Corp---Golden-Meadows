name: Sync draw.io (one PDF per model)
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download from Google Drive
        run: |
          mkdir -p drive
          download() {
            curl -fL "https://drive.google.com/uc?export=download&id=$1" -o "drive/$2"
            grep -q "<mxfile" "drive/$2" || { echo "$2 is not a draw.io file (check sharing settings)"; exit 1; }
          }
          download 1-6c25OSk3wUBW-XKGcHbhOUyIvkk69ut IS1_Project_VDML.drawio
          download 1ondUSZTKFug9XV9pIMQDr_u0hKzc-j1q IS1_Project_Goal_model.drawio
          download 1-j006A3rryGp3coW_dueU5omBixdOlJ5 IS1_Project_REA.drawio
          download 1f0HkPvfpI6yo6FCyUBMpHGYmZPtREN4g IS1_Project_EPC_model.drawio

      - name: Clear old output
        run: rm -rf figures_models

      - uses: rlespinasse/drawio-export-action@v2
        with:
          format: pdf
          path: drive
          output: ../figures_models
          action-mode: all
          all-pages: true
          crop: true
          transparent: false

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Export one multi-page PDF per draw.io model"
          file_pattern: "figures_models/*.pdf"
