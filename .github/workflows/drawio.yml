name: Sync draw.io from Drive and export
on:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download from Google Drive
        run: |
          mkdir -p media
          download() {
            curl -fL "https://drive.google.com/uc?export=download&id=$1" -o "media/$2"
            grep -q "<mxfile" "media/$2" || { echo "$2 is not a draw.io file (check sharing settings)"; exit 1; }
          }
          download 1-6c25OSk3wUBW-XKGcHbhOUyIvkk69ut IS1_Project_VDML.drawio
          download 1ondUSZTKFug9XV9pIMQDr_u0hKzc-j1q IS1_Project_Goal_model.drawio
          download 1-j006A3rryGp3coW_dueU5omBixdOlJ5 IS1_Project_REA.drawio
            
      - uses: rlespinasse/drawio-export-action@v2
        with:
          format: pdf
          path: media
          output: ../figures
          action-mode: all
          transparent: false

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync draw.io from Drive and export PDFs"
          file_pattern: "media/*.drawio figures/*.pdf"
